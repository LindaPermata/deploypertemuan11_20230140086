<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        /* Menggunakan font modern yang bersih dan minimalis */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Background gradient pink pastel estetik senada dengan halaman lainnya */
            background: linear-gradient(135deg, #fff0f5 0%, #ffd1dc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Container utama berupa form card dengan efek glassmorphism */
        form {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px); /* Efek kaca buram transparan */
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 154, 178, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px; /* Memberi jarak otomatis antar komponen input */
        }

        /* Judul di atas form register */
        form h2 {
            color: #d1526d;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Styling dasar untuk semua input field */
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid rgba(255, 154, 178, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            color: #555;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Efek glow pink lembut saat input aktif/diklik */
        input:focus {
            border-color: #ff6b8b;
            background: #fff;
            box-shadow: 0 0 8px rgba(255, 107, 139, 0.25);
        }

        /* Warna teks placeholder agar terlihat lebih soft */
        input::placeholder {
            color: #bfa1a6;
        }

        /* Styling tombol submit Register */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff8da1 0%, #ff6b8b 100%);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 139, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        /* Efek hover dinamis saat tombol disentuh kursor */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.5);
            background: linear-gradient(135deg, #ff6b8b 0%, #e65273 100%);
        }
    </style>
</head>
<body>

<form th:action="@{/register}" method="post" th:object="${request}">
    <h2>Create Account</h2>

    <input type="text"
           th:field="*{username}"
           placeholder="Username">

    <input type="password"
           th:field="*{password}"
           placeholder="Password">

    <input type="text"
           th:field="*{nama}"
           placeholder="Nama">

    <input type="text"
           th:field="*{alamat}"
           placeholder="Alamat">

    <button type="submit">
        Register
    </button>
</form>

</body>
</html>
