<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #ffd1dc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        form {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 154, 178, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        form h2 {
            color: #d1526d;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid rgba(255, 154, 178, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            color: #555;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ff6b8b;
            background: #fff;
            box-shadow: 0 0 8px rgba(255, 107, 139, 0.25);
        }

        input::placeholder {
            color: #bfa1a6;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff8da1 0%, #ff6b8b 100%);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 139, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.5);
            background: linear-gradient(135deg, #ff6b8b 0%, #e65273 100%);
        }

        /* Pembungkus area register di dalam card */
        .register-box {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        p {
            margin: 0;
            font-size: 14px;
            color: #8b4f58;
            font-weight: 600;
        }

        a {
            color: #ff6b8b;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        a:hover {
            color: #d1526d;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<form th:action="@{/login}" method="post">
    <h2>Welcome Back </h2>

    <input type="text"
           name="username"
           placeholder="Username">

    <input type="password"
           name="password"
           placeholder="Password">

    <button type="submit">
        Login
    </button>

    <div class="register-box">
        <p>Belum punya akun?</p>
        <a th:href="@{/register}">
            Register disini
        </a>
    </div>
</form>

</body>
</html>
